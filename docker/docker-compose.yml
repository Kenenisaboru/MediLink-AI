version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medilink_db
    restart: always
    environment:
      POSTGRES_USER: medilink_user
      POSTGRES_PASSWORD: medilink_password
      POSTGRES_DB: medilink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: medilink_cache
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: medilink_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://medilink_user:medilink_password@postgres:5432/medilink_db?schema=public"
      JWT_SECRET: "super_secret_jwt_access_token_key_medilink_ai_2026"
      JWT_REFRESH_SECRET: "super_secret_jwt_refresh_token_key_medilink_ai_2026"
      GEMINI_API_KEY: "AIzaSyMockAPIKeyHereForSymptomChecker"
      NODE_ENV: "production"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: medilink_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
